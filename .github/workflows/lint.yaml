name: lint
on: [push, pull_request, workflow_dispatch]

# Nothing here writes to the repository. Declared explicitly so the
# default, which is wider, is not what these jobs get.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install shfmt
        run: |
          set -euo pipefail
          curl() { command curl --retry 3 --retry-delay 2 --retry-all-errors "$@"; }
          tag=$(curl -fsSL https://api.github.com/repos/mvdan/sh/releases/latest |
            sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
          curl -fsSL -o shfmt "https://github.com/mvdan/sh/releases/download/${tag}/shfmt_${tag}_linux_amd64"
          sudo install -m755 shfmt /usr/local/bin/shfmt
          rm shfmt
          shellcheck --version
          shfmt --version

      # "shfmt -f" finds shell files by extension and shebang, so a script
      # added later is picked up without anyone remembering to edit this.
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(shfmt -f .)
          printf 'checking %s\n' "${files[@]}"
          shellcheck "${files[@]}"

      - name: shfmt
        # The .bats files are left out: "@test name {" is not shell syntax,
        # so shfmt cannot parse them. shellcheck above does read them.
        # No flags, so the settings in .editorconfig apply.
        run: |
          set -euo pipefail
          mapfile -t files < <(shfmt -f . | grep -v '\.bats$')
          printf 'checking %s\n' "${files[@]}"
          shfmt -d "${files[@]}"
